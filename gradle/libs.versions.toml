[versions]
# Minecraft / Forge (platform/forge-1.20.1)
minecraft = "1.20.1"
forge = "1.20.1-47.4.20"
parchment-minecraft = "1.20.1"
parchment = "2023.09.03"
moddevgradle = "2.0.148"

# Netty core (buffer/codec/transport) ships with Minecraft 1.20.1 at this version.
# netty-codec-http does NOT ship with it: we embed it at the same version
# via Forge Jar-in-Jar (see ADR-0003).
netty = "4.1.82.Final"

# Minecraft 1.20.1 ships slf4j-api 2.0.1; core logs through it (compileOnly).
slf4j = "2.0.1"
# Minecraft 1.20.1 ships Gson 2.10; core serializes JSON with it (compileOnly).
gson = "2.10"
# Bundled into the mod jar (ADR-0006).
sqlite-jdbc = "3.54.1.0"

# Optional mod integrations (compile only). CurseMaven: curse.maven:<slug>-<projectId>:<fileId>
# Flux Networks 7.2.1.15 for 1.20.1 = file 5234697.
flux-networks = "5234697"
# Applied Energistics 2 for 1.20.1 (modmaven). Only its public API and a few stable internals are used.
ae2 = "15.4.12"
# AE2 15.4.12 needs GuideME at runtime (dev runs only; the modpack ships its own).
guideme = "20.1.15"
# FTB Teams (team access for AE2 grids) and its runtime dependencies for dev runs.
ftb-teams = "2001.3.2"
ftb-library = "2001.2.13"
architectury = "9.2.14"

junit = "5.14.4"

[libraries]
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
flux-networks = { module = "curse.maven:flux-networks-248020", version.ref = "flux-networks" }
ae2 = { module = "appeng:appliedenergistics2-forge", version.ref = "ae2" }
guideme = { module = "org.appliedenergistics:guideme", version.ref = "guideme" }
ftb-teams = { module = "dev.ftb.mods:ftb-teams-forge", version.ref = "ftb-teams" }
ftb-library = { module = "dev.ftb.mods:ftb-library-forge", version.ref = "ftb-library" }
architectury = { module = "dev.architectury:architectury-forge", version.ref = "architectury" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
moddevgradle-legacy = { id = "net.neoforged.moddev.legacyforge", version.ref = "moddevgradle" }
