name: Feature request
description: An idea for Overseer.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do, and what is in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: input
    id: mods
    attributes:
      label: Mods involved
      placeholder: "e.g. AE2, Flux Networks, GTCEu"
