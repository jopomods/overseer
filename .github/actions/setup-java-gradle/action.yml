# JDK 17 and Gradle for every Java job. setup-gradle restores the Gradle caches (written on main
# only), validates the wrapper jar and, with the encryption key, keeps the configuration cache
# between runs so Gradle can skip configuring the build (ADR-0023).
name: Set up Java and Gradle
description: JDK 17, Gradle caches and the configuration cache
inputs:
  encryption-key:
    description: secrets.GRADLE_ENCRYPTION_KEY (empty in PRs from forks; then nothing is cached)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "17"
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-encryption-key: ${{ inputs.encryption-key }}
        add-job-summary: on-failure
