# Submits the resolved Gradle dependencies to GitHub's dependency graph, so Dependabot alerts
# cover transitive Gradle dependencies too (npm and Actions are read from their files).
name: Dependency graph

on:
  push:
    branches: [main]
    paths: ["gradle/**", "**/*.gradle.kts", "gradle.properties"]
  workflow_dispatch:

permissions: {}

jobs:
  submit:
    name: Submit Gradle dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-resolution-task: ":core:dependencies :platform:forge-1.20.1:dependencies"
          additional-arguments: -PskipWeb=true
