# Runs on every push to main and every PR. Must be green before merging (ADR-0013).
# Three jobs run in parallel; the slowest (GameTests) sets the wall time.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: gradle/actions/setup-gradle@v4

      # core + platform unit tests, web build, mod jar with embedded UI
      - name: Gradle build
        run: ./gradlew build --console=plain

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: overseer-jar
          path: platform/*/build/libs/*.jar
          retention-days: 14

  gametest:
    name: GameTests (Forge + Flux Networks + AE2, and without them)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Real Forge server (flat world) with real Flux Networks blocks; exits non-zero on failure.
      - name: Run GameTests
        run: ./gradlew :platform:forge-1.20.1:runGameTestServer -PskipWeb=true --console=plain

      # Same server without the optional mods: Overseer must load and its integrations stay off.
      - name: Run GameTests without optional mods
        run: ./gradlew :platform:forge-1.20.1:runGameTestServer -PskipWeb=true -PbareMods=true --console=plain

  web:
    name: Web lint, types and layout tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: API client is up to date with api/openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.gen.ts

      - name: Build
        run: npm run build

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Layout and flow tests (360-1920 px)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
