# Runs on every push to main and every PR. Must be green before merging (ADR-0013).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: gradle/actions/setup-gradle@v4

      # core tests, npm ci + web build, mod jar with embedded UI
      - name: Gradle build
        run: ./gradlew build --console=plain

      # Real Forge server with real Flux Networks blocks; exits non-zero on failure.
      - name: GameTests (Forge + Flux Networks)
        run: ./gradlew :platform:forge-1.20.1:runGameTestServer -PskipWeb=true --console=plain

      - name: Web lint
        working-directory: web
        run: npm run lint

      - name: Web typecheck
        working-directory: web
        run: npm run typecheck

      - name: API client is up to date with api/openapi.yaml
        working-directory: web
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.gen.ts

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Layout tests (360-1920 px)
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: overseer-jar
          path: platform/*/build/libs/*.jar
          retention-days: 14

  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
