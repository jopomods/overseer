# Runs on every PR and every push to main (ADR-0015, ADR-0023).
#
#   changes ─┬─ java ────────────────────────┐
#            ├─ gametest × suites (parallel) ┤
#            ├─ web × 3 shards (parallel) ───┼── ci-ok   (the one status to look at)
#            └─ workflows (if .github/ changed)
#
# `changes` decides which jobs a change needs (.github/ci/classify.py); pushes to main and manual
# runs always run everything, which also writes the Gradle caches that PRs only read. Every job first checks for a
# remembered pass of exactly its inputs and then skips its work. SHADOW mode ("true") runs
# everything and only reports what would have been skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  # Manual run of everything, ignoring remembered passes: for timing comparisons
  # (.github/ci/timings.py) and for suspected stale passes.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  SHADOW: "false"
  # Bump to forget every remembered pass. A manual run uses its own id, so nothing matches.
  PASS_CACHE: ${{ github.event_name == 'workflow_dispatch' && github.run_id || '2' }}

jobs:
  changes:
    name: Which jobs this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      all: ${{ steps.decide.outputs.all }}
      java: ${{ steps.decide.outputs.build }}
      build_web: ${{ steps.decide.outputs.build_web }}
      web: ${{ steps.decide.outputs.web }}
      suites: ${{ steps.decide.outputs.suites }}
      workflows: ${{ steps.decide.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Path rules still hold (fixtures)
        run: python3 -m unittest discover -s .github/ci

      - name: Classify changed paths
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          else
            echo ".github/ci/everything-on-main" > changed.txt
          fi
          python3 .github/ci/classify.py < changed.txt > rules.txt
          if [ "$SHADOW" = "true" ] || [ "$EVENT" != "pull_request" ]; then
            # Everything runs; the rules' output is only reported.
            echo "all=true" >> "$GITHUB_OUTPUT"
            grep -v '^suites=\|^build=\|^web=\|^build_web=' rules.txt >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "build_web=true" >> "$GITHUB_OUTPUT"
            python3 .github/ci/classify.py --all-suites >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
            cat rules.txt >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Jobs this change needs"
            echo
            echo "| Job | Needed by the rules | Runs |"
            echo "|---|---|---|"
            grep -v '^suites=' rules.txt | while IFS='=' read -r name value; do
              runs=$( { [ "$SHADOW" = "true" ] || [ "$EVENT" != "pull_request" ] || [ "$value" = "true" ]; } && echo yes || echo no)
              echo "| $name | $value | $runs |"
            done
            echo
            echo "GameTest suites by the rules: \`$(grep '^suites=' rules.txt | cut -d= -f2-)\`"
            echo
            echo "<details><summary>Changed paths ($(wc -l < changed.txt))</summary>"
            echo
            sed 's/^/- `/; s/$/`/' changed.txt
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  java:
    name: Java build and tests
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WITH_WEB: ${{ needs.changes.outputs.all == 'true' || needs.changes.outputs.build_web == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: passed
        uses: ./.github/actions/already-passed
        with:
          key: passed-java-${{ env.PASS_CACHE }}-${{ env.WITH_WEB }}-${{ hashFiles('.github/**', 'core/**', 'platform/**', 'api/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'version.txt', 'fixtures/**', 'web/**') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.passed.outputs.hit != 'true' && env.WITH_WEB == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: ./.github/actions/setup-java-gradle
        if: steps.passed.outputs.hit != 'true'
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # core + platform unit tests and the mod jar; with the web UI embedded when web may have
      # changed, so the jar's packaging is checked whenever it can break.
      - name: Gradle build
        if: steps.passed.outputs.hit != 'true'
        run: ./gradlew build --configuration-cache --console=plain $([ "$WITH_WEB" = "true" ] || echo -PskipWeb=true)

      - name: Upload mod jar
        if: steps.passed.outputs.hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overseer-jar
          path: platform/*/build/libs/*.jar
          retention-days: 14

      - if: steps.passed.outputs.hit != 'true'
        uses: ./.github/actions/remember-pass
        with:
          key: ${{ steps.passed.outputs.key }}

  gametest:
    name: GameTests (${{ matrix.suite }})
    # Not after `java`: every suite compiles what it needs (from the build cache), waiting only
    # adds time.
    needs: changes
    if: needs.changes.outputs.suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: passed
        uses: ./.github/actions/already-passed
        with:
          key: passed-gametest-${{ env.PASS_CACHE }}-${{ matrix.suite }}-${{ hashFiles('.github/**', 'core/**', 'platform/**', 'api/**', 'gradle/**', '*.gradle.kts', 'gradle.properties', 'version.txt', 'fixtures/**') }}
      - uses: ./.github/actions/setup-java-gradle
        if: steps.passed.outputs.hit != 'true'
        with:
          encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Real Forge server with only this suite's mods; exits non-zero on failure. A server needs
      # no client assets, so their download is skipped. The configuration cache is on only here
      # and in `java`: gameTestAll's nested builds do not support it (ADR-0023).
      - name: Run GameTests
        if: steps.passed.outputs.hit != 'true'
        env:
          SUITE: ${{ matrix.suite }}
        run: ./gradlew :platform:forge-1.20.1:runGameTestServer -PgametestSuite="$SUITE" -PskipWeb=true -x downloadAssets --configuration-cache --console=plain

      - if: steps.passed.outputs.hit != 'true'
        uses: ./.github/actions/remember-pass
        with:
          key: ${{ steps.passed.outputs.key }}

  web:
    name: Web (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # The browser tests are CPU-bound (pages with 200 devices): three parallel shards. Lint, types
    # and the API check run in the first one.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: passed
        uses: ./.github/actions/already-passed
        with:
          key: passed-web-${{ env.PASS_CACHE }}-${{ matrix.shard }}-${{ hashFiles('.github/**', 'web/**', 'api/openapi.yaml', 'fixtures/recordings/**') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.passed.outputs.hit != 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
        if: steps.passed.outputs.hit != 'true'

      - name: Lint
        if: steps.passed.outputs.hit != 'true' && matrix.shard == 1
        run: npm run lint

      - name: Typecheck
        if: steps.passed.outputs.hit != 'true' && matrix.shard == 1
        run: npm run typecheck

      - name: API client is up to date with api/openapi.yaml
        if: steps.passed.outputs.hit != 'true' && matrix.shard == 1
        run: |
          cp src/api/schema.gen.ts "$RUNNER_TEMP/schema.gen.ts"
          npm run gen:api
          cmp src/api/schema.gen.ts "$RUNNER_TEMP/schema.gen.ts"

      - name: Build
        if: steps.passed.outputs.hit != 'true'
        run: npm run build

      # The runner image has the browser's system libraries (it ships Chrome); only the browser
      # binary itself is needed, cached per Playwright version.
      - name: Playwright version
        if: steps.passed.outputs.hit != 'true'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Playwright browser cache
        if: steps.passed.outputs.hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Playwright browser
        if: steps.passed.outputs.hit != 'true'
        run: npx playwright install --only-shell chromium

      - name: Layout and flow tests (360-1920 px), shard ${{ matrix.shard }}/3
        if: steps.passed.outputs.hit != 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: npm run test:e2e -- --shard="$SHARD/3"

      - name: Upload Playwright report
        if: failure() && steps.passed.outputs.hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: web/playwright-report
          retention-days: 7

      - if: steps.passed.outputs.hit != 'true'
        uses: ./.github/actions/remember-pass
        with:
          key: ${{ steps.passed.outputs.key }}

  # Lints the workflows themselves: actionlint (syntax, expressions, shell) and zizmor (security:
  # injection, credentials, permissions, pinning).
  workflows:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false

  # The one status to look at and the required check of the ruleset on main.
  # Red if any job failed or was cancelled, or if a job the rules require did not succeed;
  # a job the rules do not require may be skipped.
  ci-ok:
    name: CI ok
    needs: [changes, java, gametest, web, workflows]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check results against what the change needs
        env:
          RESULTS: ${{ toJSON(needs) }}
          JAVA: ${{ needs.changes.outputs.java }}
          WEB: ${{ needs.changes.outputs.web }}
          SUITES: ${{ needs.changes.outputs.suites }}
          WORKFLOWS: ${{ needs.changes.outputs.workflows }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items()}
          required = {"changes"}
          if os.environ["JAVA"] == "true":
              required.add("java")
          if os.environ["WEB"] == "true":
              required.add("web")
          if json.loads(os.environ["SUITES"] or "[]"):
              required.add("gametest")
          if os.environ["WORKFLOWS"] == "true":
              required.add("workflows")
          bad = []
          for name, result in sorted(results.items()):
              if result in ("failure", "cancelled"):
                  bad.append(f"{name}: {result}")
              elif name in required and result != "success":
                  bad.append(f"{name}: {result}, but the change needs it")
          print("\n".join(f"{n}: {r}" for n, r in sorted(results.items())))
          if bad:
              print("\nNot ok:\n" + "\n".join(bad))
              sys.exit(1)
          print("\nCI ok")
          PY
