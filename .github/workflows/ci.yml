# Runs on every push to main and every PR (ADR-0013, ADR-0015).
#
#   changes ─┬─ web ──────────────────────────┐
#            ├─ build ────────────────────────┼── ci-ok   (the one status to look at)
#            └─ gametest × suites (parallel) ─┤
#   pr-title ────────────────────────────────┘
#
# Each GameTest suite runs in its own Forge server and (flat) world. `changes` decides which jobs
# a change needs (.github/ci/classify.py); pushes to main always run everything. SHADOW mode
# ("true") runs everything and only reports what would have been skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  SHADOW: "false"

jobs:
  changes:
    name: Which jobs this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.decide.outputs.all }}
      build: ${{ steps.decide.outputs.build }}
      suites: ${{ steps.decide.outputs.suites }}
      web: ${{ steps.decide.outputs.web }}
      build_web: ${{ steps.decide.outputs.build_web }}
      gt_base: ${{ steps.decide.outputs.gt_base }}
      gt_profiler: ${{ steps.decide.outputs.gt_profiler }}
      gt_flux: ${{ steps.decide.outputs.gt_flux }}
      gt_ae2: ${{ steps.decide.outputs.gt_ae2 }}
      gt_teams: ${{ steps.decide.outputs.gt_teams }}
      gt_ae2_teams: ${{ steps.decide.outputs.gt_ae2_teams }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Path rules still hold (fixtures)
        run: python3 -m unittest discover -s .github/ci

      - name: Classify changed paths
        id: decide
        run: |
          # On main and in shadow mode everything runs; the rules only report.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          else
            : > changed.txt
            echo ".github/ci/everything-on-main" >> changed.txt
          fi
          python3 .github/ci/classify.py < changed.txt > rules.txt
          if [ "$SHADOW" = "true" ] || [ "${{ github.event_name }}" != "pull_request" ]; then
            # Everything runs: the rules' output is reported, the run list is complete.
            echo "all=true" >> "$GITHUB_OUTPUT"
            grep -v '^suites=\|^build=' rules.txt >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo 'suites=["base","profiler","flux","ae2","teams","ae2-teams"]' >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
            cat rules.txt >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Jobs this change needs"
            echo
            echo "| Job | Needed by the rules | Runs |"
            echo "|---|---|---|"
            grep -v '^suites=' rules.txt | while IFS='=' read -r name value; do
              runs=$([ "$SHADOW" = "true" ] || [ "$value" = "true" ] && echo yes || echo no)
              echo "| $name | $value | $runs |"
            done
            echo
            echo "GameTest suites by the rules: \`$(grep '^suites=' rules.txt | cut -d= -f2-)\`"
            echo
            echo "<details><summary>Changed paths ($(wc -l < changed.txt))</summary>"
            echo
            sed 's/^/- `/; s/$/`/' changed.txt
            echo "</details>"
            if [ "$SHADOW" = "true" ]; then
              echo
              echo "_Shadow mode: every job runs; \"no\" would have been skipped._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Java build and tests
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # core + platform unit tests, mod jar; with the web UI embedded when web may have changed,
      # so the jar's packaging is checked whenever it can break.
      - name: Gradle build
        run: |
          if [ "${{ needs.changes.outputs.all }}" = "true" ] || [ "${{ needs.changes.outputs.build_web }}" = "true" ]; then
            ./gradlew build --console=plain
          else
            ./gradlew build -PskipWeb=true --console=plain
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: overseer-jar
          path: platform/*/build/libs/*.jar
          retention-days: 14

  gametest:
    name: GameTests (${{ matrix.suite }})
    # Not after `build`: every suite compiles what it needs anyway, so waiting only adds time.
    needs: changes
    if: needs.changes.outputs.suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      # Real Forge server with only this suite's mods; exits non-zero on failure.
      - name: Run GameTests
        run: ./gradlew :platform:forge-1.20.1:runGameTestServer -PgametestSuite=${{ matrix.suite }} -PskipWeb=true --console=plain

  web:
    name: Web lint, types and layout tests
    needs: changes
    if: needs.changes.outputs.all == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: API client is up to date with api/openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.gen.ts

      - name: Build
        run: npm run build

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Layout and flow tests (360-1920 px)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  pr-title:
    name: PR title is a Conventional Commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false

  # The one status to look at (and, once the repository is public, the one required check).
  # Red if any job failed or was cancelled, or if a job the rules require did not succeed;
  # a job the rules do not require may be skipped.
  ci-ok:
    name: CI ok
    needs: [changes, build, gametest, web, pr-title]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results against what the change needs
        env:
          RESULTS: ${{ toJSON(needs) }}
          ALL: ${{ needs.changes.outputs.all }}
          BUILD: ${{ needs.changes.outputs.build }}
          WEB: ${{ needs.changes.outputs.web }}
          SUITES: ${{ needs.changes.outputs.suites }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {name: job["result"] for name, job in json.loads(os.environ["RESULTS"]).items()}
          everything = os.environ["ALL"] == "true"
          required = {"changes"}
          if everything or os.environ["BUILD"] == "true":
              required.add("build")
          if everything or os.environ["WEB"] == "true":
              required.add("web")
          if everything or json.loads(os.environ["SUITES"] or "[]"):
              required.add("gametest")
          if os.environ["EVENT"] == "pull_request":
              required.add("pr-title")
          bad = []
          for name, result in sorted(results.items()):
              if result in ("failure", "cancelled"):
                  bad.append(f"{name}: {result}")
              elif name in required and result != "success":
                  bad.append(f"{name}: {result}, but the change needs it")
          print("\n".join(f"{n}: {r}" for n, r in sorted(results.items())))
          if bad:
              print("\nNot ok:\n" + "\n".join(bad))
              sys.exit(1)
          print("\nCI ok")
          PY
