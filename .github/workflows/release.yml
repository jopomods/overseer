# release-please keeps a release PR open on main (version bump + changelog). Merging that PR
# creates the tag and GitHub release; this workflow then builds the jar and attaches it with a
# checksum and a signed build provenance attestation (ADR-0013, ADR-0023).
#
# The release commit passed CI as a PR and on main (the ruleset requires it), so the jar is built
# with the unit tests but without repeating the browser and GameTests.
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # upload to the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # No Gradle caches for a release: built from scratch, nothing from earlier runs ends up in it.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Build the jar (with web UI and unit tests)
        run: ./gradlew build --console=plain

      - name: Checksum
        run: |
          cd platform/forge-1.20.1/build/libs
          sha256sum overseer-*.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: platform/forge-1.20.1/build/libs/overseer-*.jar

      - name: Attach jar and checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" platform/forge-1.20.1/build/libs/overseer-*.jar platform/forge-1.20.1/build/libs/SHA256SUMS.txt --clobber
