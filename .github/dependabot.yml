# Weekly dependency updates, grouped into few PRs. Titles are Conventional Commits
# ("build(deps): ...") so the PR title check passes. What Minecraft ships (Netty, Gson, SLF4J),
# Forge and the mod integrations are pinned to the game's and the modpack's versions on purpose
# (ADR-0003, gradle/libs.versions.toml) and ignored here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # TypeScript stays on 5.x until openapi-typescript supports 7 (ADR-0009).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types follow the Node version we use (24), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Gradle and JUnit majors need a deliberate upgrade (ModDevGradle, the Forge toolchain).
      - dependency-name: gradle-wrapper
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.junit:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.netty:*"
      - dependency-name: "com.google.code.gson:*"
      - dependency-name: "org.slf4j:*"
      - dependency-name: "curse.maven:*"
      - dependency-name: "appeng:*"
      - dependency-name: "org.appliedenergistics:*"
      - dependency-name: "dev.ftb.mods:*"
      - dependency-name: "dev.architectury:*"
    groups:
      gradle:
        patterns: ["*"]
        update-types: [minor, patch]
