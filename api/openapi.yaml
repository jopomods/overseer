openapi: 3.1.0
info:
  title: Overseer API
  version: 1.0.0
  description: |
    HTTP API of the Overseer dashboard (ADR-0010).

    This file is the contract. The TypeScript client in `web/src/api/schema.gen.ts`
    is generated from it (`npm run gen:api` in `web/`), and the Java side is
    tested against it. Change this file first, then the code.

    All routes live under `/api/v1`.

    **Authentication** (ADR-0007): browsers use the `ov_session` cookie (HttpOnly,
    SameSite=Strict), obtained through the link-code flow. Device tokens are sent as
    `Authorization: Bearer <token>`. State-changing requests authenticated by cookie
    must carry an `Origin` header matching the host.

    **Permissions** (ADR-0008): default deny. Responses only contain resources the
    caller may view; admins see everything.

    **Errors** use the `Error` schema with a machine-readable `code`.
servers:
  - url: /
security:
  - session: []
  - deviceToken: []
tags:
  - name: system
  - name: auth
  - name: me
  - name: data
  - name: actions
  - name: admin
paths:
  /api/v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and data freshness
      description: Unauthenticated. Suitable for external monitoring. Exposes no world data.
      security: []
      responses:
        "200":
          description: Overseer is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/auth/link-codes:
    post:
      tags: [auth]
      operationId: createLinkCode
      summary: Start a login
      description: |
        Creates a one-time code the player confirms in game with `/ov link <code>`.
        Sets the HttpOnly `ov_link` cookie that binds the code to this browser; only
        this browser can complete the login. Codes expire after 5 minutes.
        Rate limited per client address.
      security: []
      responses:
        "201":
          description: Code created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkCode"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/link-codes/current:
    get:
      tags: [auth]
      operationId: getLinkCodeStatus
      summary: Poll the pending login of this browser
      description: |
        Uses the `ov_link` cookie. When the code was confirmed in game, the response
        has status `confirmed`, sets the `ov_session` cookie and clears `ov_link`.
      security: []
      responses:
        "200":
          description: Current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkCodeStatus"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/login:
    get:
      tags: [auth]
      operationId: loginWithToken
      summary: One-time login link
      description: |
        Exchanges a one-time login token (from `ov login <player>` on the server console)
        or a device token (kiosk setup) for a session cookie, then redirects to `/`.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Logged in; redirect to the dashboard.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Logged out; session cookie cleared.

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The logged-in player
      responses:
        "200":
          description: Current principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/credentials:
    get:
      tags: [me]
      operationId: listCredentials
      summary: Sessions and device tokens of the logged-in player
      responses:
        "200":
          description: All active credentials.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/credentials/{id}:
    delete:
      tags: [me]
      operationId: revokeCredential
      summary: Revoke one session or device token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/me/credentials/revoke-all:
    post:
      tags: [me]
      operationId: revokeAllCredentials
      summary: Log out everywhere
      description: Revokes every session of the player, including the current one. Device tokens are kept.
      responses:
        "204":
          description: All sessions revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/me/device-tokens:
    post:
      tags: [me]
      operationId: createDeviceToken
      summary: Create a read-only device token
      description: The token is returned once and cannot be retrieved later. Not available to device tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceToken"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedDeviceToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/providers:
    get:
      tags: [data]
      operationId: listProviders
      summary: Active data providers
      responses:
        "200":
          description: Providers loaded on this server.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/providers/{provider}/snapshot:
    get:
      tags: [data]
      operationId: getProviderSnapshot
      summary: Latest snapshot of one provider
      description: Contains only resources the caller may view.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Latest filtered snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/stream:
    get:
      tags: [data]
      operationId: streamSnapshots
      summary: Live updates (Server-Sent Events)
      description: |
        `text/event-stream`. Each `snapshot` event carries a filtered `Snapshot` as JSON.
        Permissions are re-checked for every event; a revoked session ends the stream.
        A comment line is sent every 15 s as keep-alive.
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/history:
    get:
      tags: [data]
      operationId: getHistory
      summary: History of one resource for charts
      description: |
        Time range in **server uptime** (ADR-0005). The server picks the resolution (raw,
        minute or hour rollups) from the requested number of points and aggregates
        time-weighted into equal buckets. Each point also carries the calendar time of its
        bucket, so clients can plot either axis. Not visible or unknown resources → 404.
      parameters:
        - name: resource
          in: query
          required: true
          description: |
            Resource key `provider/type/id`, e.g. `flux/network/1`. Repeat for several resources
            (at most 250); invisible ones are skipped, and if none is visible the answer is 404.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: metric
          in: query
          required: true
          description: One or more metrics (repeat the parameter), at most 10.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: from
          in: query
          description: Start, server uptime in ms. Default `to` minus 24 h.
          schema:
            type: integer
            format: int64
        - name: to
          in: query
          description: End, server uptime in ms. Default now.
          schema:
            type: integer
            format: int64
        - name: points
          in: query
          description: Maximum number of points per series (10-1000, default 240).
          schema:
            type: integer
      responses:
        "200":
          description: Aggregated series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/sessions:
    get:
      tags: [data]
      operationId: getSessions
      summary: Server uptime sessions
      description: |
        One entry per server run. Gaps between sessions are offline periods; charts on the
        server-uptime axis mark them, charts on the calendar axis show them as gaps.
      responses:
        "200":
          description: Sessions and the current uptime.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sessions"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/inventory:
    get:
      tags: [data]
      operationId: getInventory
      summary: Contents of a resource with net changes
      description: |
        Current contents from the newest scan (AE2: every 10 s) and the net change per key over
        the last hour and day (minute resolution). Keys used up completely are listed with
        amount 0 while they have a change. The first scan of a resource is a baseline, not a
        change. 404 when the resource is not visible.
      parameters:
        - name: resource
          in: query
          required: true
          description: Resource key `provider/type/id`, e.g. `ae2/grid/minecraft:overworld@0,64,0`.
          schema:
            type: string
        - name: q
          in: query
          description: Case-insensitive search in name and key.
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [item, fluid, other]
        - name: sort
          in: query
          description: amount (largest first), name, or change (largest absolute 24 h change first).
          schema:
            type: string
            enum: [amount, name, change]
            default: amount
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of matching keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/events:
    get:
      tags: [data]
      operationId: listEvents
      summary: Recorded changes of a resource
      description: |
        Added, removed and attribute changes of one resource, newest first. Used for the job
        history of AE2 crafting CPUs (attribute `job`). 404 when the resource is not visible.
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
        - name: attribute
          in: query
          description: Only changes of these attributes (repeat, at most 20); added/removed always.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Events, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/jobs:
    get:
      tags: [data]
      operationId: getJob
      summary: Lines of a running crafting job (live)
      description: |
        What a running job holds and waits for, as in AE2's crafting status screen: per key the
        amount stored in the CPU, sent to machines (active) and still to craft (pending).
        Refreshed every second, never stored. 404 when the resource is idle or not visible.
      parameters:
        - name: resource
          in: query
          required: true
          description: Resource key, e.g. `ae2/cpu/minecraft:overworld@1,60,2`.
          schema:
            type: string
      responses:
        "200":
          description: The running job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/inventory/history:
    get:
      tags: [data]
      operationId: getInventoryHistory
      summary: How the amount of one item moved
      description: |
        Any item, watched or not, at minute resolution from the inventory scans (kept for the raw
        retention, 48 h by default). `start` is the amount at `from`; each point is
        `[uptime of the minute, amount at its end]` and the amount stays until the next point.
        `now` is the amount in the newest scan.
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
        - name: item
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: integer
            format: int64
        - name: to
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/icon:
    get:
      tags: [data]
      operationId: getIcon
      summary: Item icon as PNG
      description: |
        Icon of a stack key. Exported icons (rendered by a client with `/ov icons export`) first,
        then the base key without NBT hash, then a texture from the mod jar if there is one.
        Cached by the browser for a day; misses for an hour.
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The icon.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/watches:
    get:
      tags: [data]
      operationId: listWatches
      summary: Watched items of a resource
      description: |
        Items read every second (AE2: per ME network). Their live amounts arrive as metrics
        `stock:<item>` of the resource in the snapshot; their history via `/history`.
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Watched items, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Watch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [data]
      operationId: addWatch
      summary: Watch an item or change its target
      description: |
        Owners (edit rights) only. The item must be in the newest inventory scan (or already
        watched). At most 50 watched items per resource. Without `target` the item is only watched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, item]
              properties:
                resource:
                  type: string
                item:
                  type: string
                target:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Minimum stock for the deficit view.
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [data]
      operationId: removeWatch
      summary: Stop watching an item
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
        - name: item
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/overrides:
    get:
      tags: [data]
      operationId: listOverrides
      summary: Overseer-side settings of resources, e.g. zones
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Overrides of resources visible to the caller.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Override"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [data]
      operationId: setOverride
      summary: Set or clear an override
      description: |
        Needs edit rights on the resource (dashboard admins, or what the mod allows, e.g.
        Flux network owners and admins). Allowed keys - `zone`, `name`. `value: null` clears it.
        Values are at most 48 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Override"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/actions:
    post:
      tags: [actions]
      operationId: runAction
      summary: Change something in the world (ADR-0016)
      description: |
        Runs a world action of the resource's provider on the server thread and waits for it
        (up to 10 s). Allowed for server operators and for players the mod itself allows (e.g.
        Flux network owners and admins); dashboard admins who are not operators get no extra
        rights. Never with a device token. Every outcome is logged, refusals included.
        Rate limit: 60 per minute and player.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunAction"
      responses:
        "200":
          description: Applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          description: Unknown action or invalid parameters (`status` = `invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Not allowed (`status` = `denied`), or a device token.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ActionResult"
                  - $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The target cannot be changed right now, e.g. its chunk is not loaded (`unavailable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          description: The provider failed while applying it (`failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "503":
          description: The server did not get to it in time or is stopping (`busy`); nothing was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
    get:
      tags: [actions]
      operationId: listActions
      summary: Log of world actions, newest first
      description: |
        Actions on the resource or that changed it, refusals included, for anyone who can see
        the resource. Without `resource` only for dashboard admins (everything they can see).
        Parameters are never returned; the changes say what happened.
      parameters:
        - name: resource
          in: query
          description: Resource key, e.g. `flux/network/3`.
          schema:
            type: string
        - name: before
          in: query
          description: Only entries with a smaller id (paging).
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Log entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionLogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/actions/allowed:
    get:
      tags: [actions]
      operationId: allowedActions
      summary: World actions the caller may run on a resource
      description: The UI shows edit controls only for these. Empty for most viewers and for device tokens.
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Allowed action types.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowedActions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/shares:
    get:
      tags: [data]
      operationId: listShares
      summary: Players a resource is shared with
      description: |
        Only for providers with Overseer sharing (AE2 grids) and for callers with edit rights
        on the resource (its owner, dashboard admins).
      parameters:
        - name: resource
          in: query
          required: true
          description: Resource key, e.g. `ae2/grid/minecraft:overworld@1,64,2`.
          schema:
            type: string
      responses:
        "200":
          description: Shares of the resource.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Share"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [data]
      operationId: addShare
      summary: Share a resource with a player (view only)
      description: |
        The player is found by name among players who logged in to the dashboard at least
        once. Sharing twice is harmless.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, name]
              properties:
                resource:
                  type: string
                name:
                  type: string
                  maxLength: 16
      responses:
        "201":
          description: Shared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [data]
      operationId: removeShare
      summary: Remove a share
      description: Owners remove any share; a player may remove their own (leave).
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
        - name: player
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/access/requestable:
    get:
      tags: [data]
      operationId: listRequestable
      summary: Resources the caller cannot see but may ask access for
      description: |
        Shareable resources with an owner that are hidden from the caller. Only an opaque
        handle, the Overseer name and the owner's name are returned, never ids: ids contain
        block positions.
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Requestable resources.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Requestable"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/access/requests:
    get:
      tags: [data]
      operationId: listAccessRequests
      summary: Pending requests on resources the caller may manage
      responses:
        "200":
          description: Pending requests, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [data]
      operationId: requestAccess
      summary: Ask the owner for access
      description: |
        The owner gets an in-game message. Asking again while pending is harmless; after a
        denial the same player may ask again after 24 hours (409 before).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, handle]
              properties:
                provider:
                  type: string
                handle:
                  type: string
      responses:
        "201":
          description: Pending.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Declined recently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many requests.

  /api/v1/access/decisions:
    post:
      tags: [data]
      operationId: decideAccessRequest
      summary: Approve (creates a share) or decline a request
      description: Needs edit rights on the resource. The requester gets an in-game message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource, player, approve]
              properties:
                resource:
                  type: string
                player:
                  type: string
                  format: uuid
                approve:
                  type: boolean
      responses:
        "204":
          description: Decided.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/registrations:
    post:
      tags: [data]
      operationId: registerResource
      summary: Adopt a hidden resource (admins)
      description: |
        Registers a resource the mod does not identify by itself, e.g. an AE2 grid without
        controller (`kind: hidden`). The admin becomes its owner; `name` sets the name override.
        Players register in game with `/ov ae2 register <name>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource]
              properties:
                resource:
                  type: string
                name:
                  type: string
                  maxLength: 48
      responses:
        "204":
          description: Registered.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [data]
      operationId: unregisterResource
      summary: Remove a registration (owner or admin)
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed; the resource is hidden again.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/collectors:
    get:
      tags: [admin]
      operationId: getCollectors
      summary: Collector cost and health per provider
      responses:
        "200":
          description: Collector status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collectors"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/storage:
    get:
      tags: [admin]
      operationId: getStorage
      summary: Database size, usage per provider and storage settings
      responses:
        "200":
          description: Storage overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/profiler:
    get:
      tags: [admin]
      operationId: getProfiler
      summary: Tick profiler state (ADR-0014)
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profiler"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [admin]
      operationId: setProfiler
      summary: Start or stop the tick profiler
      description: |
        `timed` measures for `durationSeconds` (10 to 86400), `continuous` until stopped, `off`
        stops. `intervalSeconds` (5 to 300) is how often a measurement is taken and stored.
        Measuring costs a little tick time itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [off, timed, continuous]
                durationSeconds:
                  type: integer
                  format: int64
                intervalSeconds:
                  type: integer
      responses:
        "200":
          description: New state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profiler"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/details:
    get:
      tags: [data]
      operationId: getDetails
      summary: Live table of a resource
      description: |
        Rows of named columns a provider sends with every collection and Overseer never stores,
        e.g. the tick profiler's top list (`profiler/total/all`). 404 when there is none or the
        resource is not visible.
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Details"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/storage/settings:
    put:
      tags: [admin]
      operationId: setStorageSettings
      summary: Retention and size warning
      description: Retention in server-uptime milliseconds, 0 = forever. Raw data is kept at least 1 hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageSettings"
      responses:
        "204":
          description: Saved; applies from the next rollup run.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/storage/purge:
    post:
      tags: [admin]
      operationId: purgeStorage
      summary: Delete history of a provider
      description: Deletes raw samples and rollups (all, or older than the given uptime span). Resources and events stay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurgeRequest"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/storage/vacuum:
    post:
      tags: [admin]
      operationId: vacuumStorage
      summary: Compact the database file (SQLite VACUUM)
      responses:
        "204":
          description: Done.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/storage/backup:
    get:
      tags: [admin]
      operationId: downloadBackup
      summary: Download a consistent copy of the database
      responses:
        "200":
          description: SQLite database file.
          content:
            application/vnd.sqlite3:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ov_session
    deviceToken:
      type: http
      scheme: bearer

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not logged in, or the credential is invalid, expired or revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Logged in, but not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource (or not visible to the caller).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded; retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable, e.g. `unauthorized`, `forbidden`, `not_found`, `rate_limited`.
            message:
              type: string

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: "`degraded` when collection or storage is falling behind."
        version:
          type: string
          description: Overseer version, e.g. `0.1.0`.
          example: 0.1.0
        dataAgeMillis:
          type: integer
          format: int64
          description: Age of the newest snapshot in milliseconds. Absent before the first collection.
          example: 840

    LinkCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: Shown to the user, e.g. `7KQ-4M2`. Confirm in game with `/ov link <code>`.
          example: 7KQ-4M2
        expiresAt:
          type: string
          format: date-time

    LinkCodeStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, expired]

    Role:
      type: string
      enum: [player, admin, super_admin]
      description: "`super_admin` = server operator or console; `admin` = granted dashboard admin."

    Me:
      type: object
      required: [uuid, name, role, deviceToken]
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        deviceToken:
          type: boolean
          description: True when authenticated with a device token (read-only, cannot manage credentials).

    Credential:
      type: object
      required: [id, kind, createdAt, lastUsedAt, current]
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [session, device_token]
        name:
          type: string
          description: Device token name, or the browser user agent of a session.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: The credential used for this request.

    CreateDeviceToken:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          example: Tablet on the wall

    CreatedDeviceToken:
      type: object
      required: [id, token]
      properties:
        id:
          type: integer
          format: int64
        token:
          type: string
          description: "Shown once. Use as `Authorization: Bearer <token>`."

    Provider:
      type: object
      required: [id, displayName, capabilities]
      properties:
        id:
          type: string
          example: flux
        displayName:
          type: string
          example: Flux Networks
        capabilities:
          type: array
          items:
            type: string
            enum: [metrics, events, inventory, access_control]

    Timestamp:
      type: object
      required: [wall, uptimeMillis, session]
      properties:
        wall:
          type: string
          format: date-time
        uptimeMillis:
          type: integer
          format: int64
          description: Accumulated server uptime (ADR-0005).
        session:
          type: integer
          description: Uptime session number.

    Watch:
      type: object
      required: [item, name, kind, createdAt, change1h, change24h]
      properties:
        item:
          type: string
          description: Stack key.
        name:
          type: string
        kind:
          type: string
          enum: [item, fluid, other]
        target:
          type: integer
          format: int64
          description: Minimum stock; absent when only watched.
        createdAt:
          type: string
          format: date-time
        change1h:
          type: integer
          format: int64
          description: Net change over the last hour (from the inventory scans).
        change24h:
          type: integer
          format: int64
          description: Net change over the last day; basis of the forecast.

    Job:
      type: object
      required: [resource, at, lines]
      properties:
        resource:
          type: string
        at:
          $ref: "#/components/schemas/Timestamp"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JobLine"

    JobLine:
      type: object
      required: [key, kind, name, stored, active, pending]
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [item, fluid, other]
        name:
          type: string
        stored:
          type: integer
          format: int64
          description: Already in the CPU.
        active:
          type: integer
          format: int64
          description: Sent to machines, waiting for them to return.
        pending:
          type: integer
          format: int64
          description: Still to be crafted.

    Profiler:
      type: object
      required: [mode, intervalSeconds, active]
      properties:
        mode:
          type: string
          enum: [off, timed, continuous]
        until:
          type: string
          format: date-time
          description: End of a timed run.
        intervalSeconds:
          type: integer
        active:
          type: boolean
          description: Measuring right now.

    Details:
      type: object
      required: [resource, at, rows]
      properties:
        resource:
          type: string
        at:
          $ref: "#/components/schemas/Timestamp"
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type: string

    Event:
      type: object
      required: [at, kind]
      properties:
        at:
          $ref: "#/components/schemas/Timestamp"
        kind:
          type: string
          enum: [added, removed, attribute]
        attribute:
          type: string
          description: Changed attribute; absent for added and removed.
        value:
          type: string
          description: New value; absent when the attribute was removed.

    Inventory:
      type: object
      required: [resource, total, items]
      properties:
        resource:
          type: string
          description: Resource key.
        scannedAt:
          description: Time of the newest scan; absent before the first scan.
          $ref: "#/components/schemas/Timestamp"
        total:
          type: integer
          description: Number of matching keys (all pages).
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"

    InventoryHistory:
      type: object
      required: [resource, item, from, to, start, points]
      properties:
        resource:
          type: string
        item:
          type: string
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        start:
          type: integer
          format: int64
        now:
          type: integer
          format: int64
        points:
          type: array
          items:
            type: array
            items:
              type: integer
              format: int64
            minItems: 2
            maxItems: 2

    InventoryItem:
      type: object
      required: [key, kind, name, amount, change1h, change24h]
      properties:
        key:
          type: string
          description: "`<kind>:<registry id>`, plus `#<hash>` of the NBT when present."
        kind:
          type: string
          enum: [item, fluid, other]
        name:
          type: string
          description: Display name as the server resolves it (English).
        amount:
          type: integer
          format: int64
          description: Items, or mB for fluids.
        change1h:
          type: integer
          format: int64
        change24h:
          type: integer
          format: int64

    ResourceRef:
      type: object
      required: [provider, type, id, key]
      properties:
        provider:
          type: string
        type:
          type: string
        id:
          type: string
        key:
          type: string
          description: "`provider/type/id`"

    Resource:
      type: object
      required: [ref, attributes, metrics, canEdit]
      properties:
        ref:
          $ref: "#/components/schemas/ResourceRef"
        attributes:
          type: object
          additionalProperties:
            type: string
        metrics:
          type: object
          additionalProperties:
            type: number
        canEdit:
          type: boolean
          description: The viewer may change Overseer settings of this resource (e.g. a zone).

    Snapshot:
      type: object
      required: [provider, at, resources]
      properties:
        provider:
          type: string
        at:
          $ref: "#/components/schemas/Timestamp"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/Resource"

    CollectorStatus:
      type: object
      required: [provider, baseIntervalTicks, currentIntervalTicks, budgetNanos, runs, errors, overruns, lastNanos, avgNanos, maxNanos, throttled]
      properties:
        provider:
          type: string
        baseIntervalTicks:
          type: integer
        currentIntervalTicks:
          type: integer
        budgetNanos:
          type: integer
          format: int64
        runs:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        overruns:
          type: integer
          format: int64
        lastNanos:
          type: integer
          format: int64
        avgNanos:
          type: integer
          format: int64
        maxNanos:
          type: integer
          format: int64
        throttled:
          type: boolean
        lastError:
          type: string

    HistoryPoint:
      type: object
      required: [t, wall, session, min, max, avg, last]
      properties:
        t:
          type: integer
          format: int64
          description: Bucket start, server uptime in ms.
        wall:
          type: string
          format: date-time
          description: Calendar time at the bucket start.
        session:
          type: integer
        min:
          type: number
        max:
          type: number
        avg:
          type: number
          description: Time-weighted average over the bucket.
        last:
          type: number

    HistorySeries:
      type: object
      required: [resource, metric, points]
      properties:
        resource:
          type: string
        metric:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/HistoryPoint"

    History:
      type: object
      required: [resource, resolution, from, to, bucketMillis, series]
      properties:
        resource:
          type: string
        resolution:
          type: string
          enum: [raw, minute, hour]
        from:
          type: integer
          format: int64
        to:
          type: integer
          format: int64
        bucketMillis:
          type: integer
          format: int64
        series:
          type: array
          items:
            $ref: "#/components/schemas/HistorySeries"

    Session:
      type: object
      required: [session, startedAt, startedUptime, lastAt, lastUptime]
      properties:
        session:
          type: integer
        startedAt:
          type: string
          format: date-time
        startedUptime:
          type: integer
          format: int64
        lastAt:
          type: string
          format: date-time
        lastUptime:
          type: integer
          format: int64

    Sessions:
      type: object
      required: [uptimeMillis, sessions]
      properties:
        uptimeMillis:
          type: integer
          format: int64
          description: Current server uptime.
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    Requestable:
      type: object
      required: [provider, handle, ownerName, request]
      properties:
        provider:
          type: string
        handle:
          type: string
          description: Opaque, stable per server.
        name:
          type: [string, "null"]
          description: Overseer name, if the owner set one.
        ownerName:
          type: string
        request:
          type: string
          enum: [none, pending, denied]

    AccessRequest:
      type: object
      required: [resource, player, requestedAt]
      properties:
        resource:
          type: string
        resourceName:
          type: [string, "null"]
        player:
          type: string
          format: uuid
        name:
          type: [string, "null"]
        requestedAt:
          type: string
          format: date-time

    Share:
      type: object
      required: [player, grantedAt]
      properties:
        player:
          type: string
          format: uuid
        name:
          type: [string, "null"]
          description: Last known dashboard name.
        grantedBy:
          type: [string, "null"]
          format: uuid
        grantedAt:
          type: string
          format: date-time

    Override:
      type: object
      required: [resource, key]
      properties:
        resource:
          type: string
          description: Resource key, e.g. `flux/device/minecraft:overworld@1,64,2`.
        key:
          type: string
          enum: [zone, name]
          description: "`zone`: zone of a Flux device. `name`: name of a resource the mod does not name (AE2 grids)."
        value:
          type: [string, "null"]

    RunAction:
      type: object
      required: [type, resource]
      properties:
        type:
          type: string
          description: Action type of the resource's provider, e.g. `flux.network.edit`.
        resource:
          type: string
          description: Target resource key; permissions are checked against it.
        params:
          type: object
          additionalProperties: true
          description: Action-specific parameters (see the provider's module docs).

    ActionChange:
      type: object
      required: [resource, field]
      properties:
        resource:
          type: string
        field:
          type: string
          description: What changed, e.g. `name`, `priority`.
        before:
          type: [string, "null"]
        after:
          type: [string, "null"]

    ActionResult:
      type: object
      required: [status, changes]
      properties:
        status:
          type: string
          enum: [ok, invalid, denied, not_found, unavailable, busy, failed]
        message:
          type: [string, "null"]
          description: Why it was not applied.
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ActionChange"
        data:
          type: [object, "null"]
          additionalProperties: true
          description: |
            What the action found out for the caller, never logged (ADR-0019). Its shape belongs to
            the action type, e.g. the crafting plan of `ae2.craft.plan` (docs/modules/ae2.md).

    ActionLogEntry:
      type: object
      required: [id, at, actor, actorName, operator, action, resource, status, changes]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor:
          type: string
          format: uuid
        actorName:
          type: string
        operator:
          type: boolean
          description: The actor was a server operator at the time.
        action:
          type: string
        resource:
          type: string
          description: Target resource key.
        status:
          type: string
          enum: [ok, invalid, denied, not_found, unavailable, busy, failed]
        message:
          type: [string, "null"]
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ActionChange"

    AllowedActions:
      type: object
      required: [resource, types]
      properties:
        resource:
          type: string
        types:
          type: array
          items:
            type: string

    StorageSettings:
      type: object
      required: [rawMillis, minuteMillis, hourMillis, warnBytes]
      properties:
        rawMillis:
          type: integer
          format: int64
        minuteMillis:
          type: integer
          format: int64
        hourMillis:
          type: integer
          format: int64
        warnBytes:
          type: integer
          format: int64
          description: Show a warning above this database size; 0 = never.

    ProviderUsage:
      type: object
      required: [provider, series, raw, minute, hour, inventoryChanges]
      properties:
        provider:
          type: string
        series:
          type: integer
          format: int64
        raw:
          type: integer
          format: int64
        minute:
          type: integer
          format: int64
        hour:
          type: integer
          format: int64
        inventoryChanges:
          type: integer
          format: int64
          description: Per-minute inventory change rows (deleted by a purge too).

    Storage:
      type: object
      required: [fileBytes, walBytes, settings, providers, icons, iconBytes]
      properties:
        icons:
          type: integer
          format: int64
          description: Exported item icons stored.
        iconBytes:
          type: integer
          format: int64
        fileBytes:
          type: integer
          format: int64
        walBytes:
          type: integer
          format: int64
        settings:
          $ref: "#/components/schemas/StorageSettings"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderUsage"

    PurgeRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
        olderThanMillis:
          type: integer
          format: int64
          description: Only delete data older than this much server uptime; omit to delete all.

    PurgeResult:
      type: object
      required: [deletedRows]
      properties:
        deletedRows:
          type: integer
          format: int64

    Collectors:
      type: object
      required: [collectors, droppedSnapshots, queuedSnapshots]
      properties:
        collectors:
          type: array
          items:
            $ref: "#/components/schemas/CollectorStatus"
        droppedSnapshots:
          type: integer
          format: int64
        queuedSnapshots:
          type: integer
